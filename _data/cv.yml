  sections:
    Experience:
      - company: Korea Electronics Technology Institute (KETI)
        position: Postdoctoral Researcher
        location: South Korea
        start_date: 2018-06
        end_date: present
        highlights:
          - "Driver-state monitoring system built to the requirement UN-R171 Section 5.5.4 sets for DCAS: gaze zone, eye closure (EAR), PERCLOS and head pose feeding a six-rule Euro NCAP state machine. Produced the conformance mapping across UN-R171, GSR II, Euro NCAP and UN-R157."
          - "Multi-camera in-cabin inference system: four cameras through ROS 2 on a single NVIDIA Jetson AGX Orin 64GB, one 10 Hz JSON stream over TCP. TensorRT FP16 cut inference from 14.44 to 9.59 ms per frame."
          - "QueryGaze: single-pass gaze-target model on a frozen DINOv3 backbone, 0.956 GazeFollow AUC at 15M parameters, real time on-device."
          - "Real-time super-resolution for edge NPUs; first place at AIS 2024 (CVPR) and Mobile AI 2022 (ECCV)."
          - "On-device LLM inference (LLaMA-3.2, Qwen, DeepSeek) on Raspberry Pi 4: 2x faster at 4.91 W vs 5.52 W."
          - "Autonomous-driving perception: semantic segmentation (77.1% mIoU at 102 FPS), 2D/3D detection, traffic-light recognition, sensor-integrity models on TI TDA4VM and NVIDIA Xavier."
      - company: Chowis Co., Ltd.
